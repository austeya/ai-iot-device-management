name: Deploy to AWS ECS

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push dashboard image
        run: |
          docker build -t ai-iot-dashboard -f dashboard/Dockerfile .
          docker tag ai-iot-dashboard:latest 019292670370.dkr.ecr.eu-central-1.amazonaws.com/ai-iot-dashboard:latest
          docker push 019292670370.dkr.ecr.eu-central-1.amazonaws.com/ai-iot-dashboard:latest

      - name: Build, tag, and push simulator image
        run: |
          docker build -t ai-iot-simulator -f simulator/Dockerfile .
          docker tag ai-iot-simulator:latest 019292670370.dkr.ecr.eu-central-1.amazonaws.com/ai-iot-simulator:latest
          docker push 019292670370.dkr.ecr.eu-central-1.amazonaws.com/ai-iot-simulator:latest

      - name: Deploy ECS dashboard service
        run: |
          aws ecs update-service \
            --cluster ai-iot-cluster \
            --service ai-iot-dashboard \
            --force-new-deployment \
            --region eu-central-1
