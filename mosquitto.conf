# Listen on all interfaces inside the container
listener 1883 0.0.0.0

# For a local demo project it's fine to allow anonymous clients.
# (If you need auth later, we can add usernames/passwords.)
allow_anonymous true

# Persist retained messages (optional)
persistence true
persistence_location /mosquitto/data/

# Helpful logging
log_type error
log_type warning
log_type notice
log_type information
